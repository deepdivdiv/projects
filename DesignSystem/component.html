function 학생(이름, 점수){
  this.이름 = 이름

}

function profileInfo(name, age, like, sex) {
  this.name = name
  this.age = age
  this.like = like
  this.sex = sex
  this.보여주기 = function() {
    alert(`이름: ${this.name}\n나이: ${this.age}\n취미: ${this.like}\n성별: ${this.sex}

위 정보가 맞습니까?
    `)
  }
}

function 내정보보여줄랭() {
    let 내정보 = new profileInfo(
        document.getElementById('forName').value,
        document.getElementById('forAgo').value,
        document.getElementById('forLike').value,
        document.getElementById('forSex').value,
    )
    내정보.보여주기()
}
